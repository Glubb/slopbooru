[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kareha"
version = "0.1.0"
description = "Python port of Kareha (image/message board software)"
readme = "README.md"
license = {text = "MIT"}  # or match original spirit
requires-python = ">=3.10"
authors = [
  {name = "Grok-assisted port from original Kareha 3.1.4"}
]
dependencies = [
  "jinja2>=3.1",
  "pillow>=10.0",
  "werkzeug>=3.0",   # minimal WSGI routing + request/response (pragmatic choice for raw WSGI feel)
  "python-multipart>=0.0.6",  # for form parsing in some WSGI setups
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff",
  "black",
  "mypy",
]

[project.scripts]
kareha = "kareha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kareha"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = false  # start lenient during port
