<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ title }}{% endblock %} - Kareha</title>
  <link rel="stylesheet" href="{{ script_root | default('') }}/css/{{ default_style|lower|replace(' ', '_') }}.css">
  <link rel="shortcut icon" href="{{ script_root | default('') }}/favicon.ico">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <hr>
  <p style="font-size: small; color: #888;">
    Powered by <a href="https://github.com/">Kareha-Py</a> (Python port of Kareha)
  </p>
</body>
</html>
